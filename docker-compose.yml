services:
  demo_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rokonzaman/demo_app:${IMAGE_TAG:-1.0.0}
    container_name: demo_app
    init: true
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
